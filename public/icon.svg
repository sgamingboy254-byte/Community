<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />

  <!-- Gold decorative ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGradient)" stroke-width="12" stroke-opacity="0.4" stroke-dasharray="24 16" />

  <!-- VC Letters Logo -->
  <g fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="246" font-size="190" letter-spacing="-6">VC</text>
  </g>

  <!-- Community sub-badge -->
  <rect x="166" y="360" width="180" height="36" rx="18" fill="url(#goldGradient)" />
  <text x="256" y="378" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#18181b" text-anchor="middle" dominant-baseline="central" letter-spacing="2">COMMUNITY</text>
</svg>
